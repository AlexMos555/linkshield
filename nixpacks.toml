providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
nixPkgs = ["python311", "gcc"]
aptPkgs = ["python3-venv"]

# No `pip install --upgrade pip`: it fetched an unpinned pip from the network on
# every build, and a truncated download (hash mismatch) failed the 2026-10-09
# production deploy. The venv's bundled pip installs requirements.txt fine.
[phases.install]
cmds = [
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install --no-cache-dir -r requirements.txt",
]

[start]
cmd = ". /opt/venv/bin/activate && python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT"
