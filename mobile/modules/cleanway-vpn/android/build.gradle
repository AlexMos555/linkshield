// Expo SDK 58: the module MUST be built with `expo-module-gradle-plugin`, as
// every Expo package is. The plugin adds the "pika" Kotlin compiler plugin,
// which fills in expo-modules-core's compile-time type intrinsics. With the
// old `apply from: ExpoModulesCorePlugin.gradle` wiring (SDK 52–54) the module
// still compiles, but every Function/AsyncFunction that returns a value hits
// an unfilled intrinsic in definition() and the app dies at start with
// "This function has a reified type parameter and thus can only be inlined at
// compilation time" (1.1.0 (110) and the first (111), Galaxy, 2026-11-12).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cleanwayvpn'
version = '0.1.0'

android {
  namespace "expo.modules.cleanwayvpn"
  // JVM unit tests: android.util.Log etc. are unmocked stubs; make them no-ops
  // so BlocklistSync/BlockLog (which log) are testable without Robolectric.
  testOptions.unitTests.returnDefaultValues = true
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // NotificationCompat — the VpnService must run in the foreground with a
  // persistent notification or Android kills it when the app backgrounds.
  implementation "androidx.core:core-ktx:1.13.1"
  // DnsUtilTest.kt uses kotlin.test (JUnit backend). Test-only — does not affect the app build.
  testImplementation "org.jetbrains.kotlin:kotlin-test-junit"
  // org.json is an unmocked Android stub on the JVM; BlockLog serialises with it.
  testImplementation "org.json:json:20240303"
}
