name: 'Tombstone dead popular names'

# Weekly sweep of every name of data/top_100k.json and
# data/top_domains_reported.json: one both Cloudflare and Google answer
# NXDOMAIN for, and whose parent zone has no delegation for, is added to
# data/top_domains_dead.json, which takes all the lists' trust from it
# (api/services/dead_top_names.py) before anyone can buy it — a name stays
# NXDOMAIN for weeks between its expiry and its release. The phone's veto
# (popular_veto.txt) is rebuilt in the same PR.
#
# Then the rest of the top-1M ranking (ranks 100k-1M, rebuilt here as the
# daily rank refresh builds it) is swept into data/top_1m_dead.json, in a
# step of its own with a time limit and a cap of its own: when it fails or
# runs out of time, the top lists' tombstones still ship.
#
# Opens a PR; humans review before merging. CI does not run on a PR this
# token opens, so the checks CI would run on these files run here, before
# the PR. Names that resolve again stay tombstoned: they are listed in the
# PR, or in an issue when nothing new died, for a person to check who holds
# them now.

on:
  schedule:
    # Wednesday 04:53 UTC — away from the daily ranks (03:17) and the
    # Sunday favicon refresh (04:42).
    - cron: '53 4 * * 3'
  workflow_dispatch:
    inputs:
      max_new_band:
        description: 'Cap on new ranks 100k-1M tombstones (empty: the script default; for a bootstrap run)'
        required: false
        default: ''

# Read-only by default; the one job that opens the PR gets write.
permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 330
    env:
      BRANCH: cleanway/refresh-dead-top-names
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # The open PR of an earlier run is replaced by this run's: the names it
      # adds are carried over, never dropped. Only what it adds against the
      # commit it branched from (its merge base with main, whatever commits
      # a person added on top), and only while it is open and ours (not a
      # fork's): a merged or closed one, or a line removed on main by hand,
      # never comes back.
      - name: Carry over an open sweep PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then exit 0; fi           # no such branch
          if [ "$code" -ne 0 ]; then exit "$code"; fi     # cannot tell: stop, do not drop
          open=$(gh pr list --head "$BRANCH" --state open --json isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)] | length')
          if [ "$open" = "0" ]; then exit 0; fi
          git fetch --depth=1 origin "$BRANCH"
          head=$(git rev-parse FETCH_HEAD)
          base=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$BRANCH" --jq .merge_base_commit.sha)
          git fetch --depth=1 origin "$base"
          for f in top_domains_dead top_1m_dead; do
            git show "$head:data/$f.json" > "$RUNNER_TEMP/pending-$f.json" \
              || echo '{"names": {}}' > "$RUNNER_TEMP/pending-$f.json"
            git show "$base:data/$f.json" > "$RUNNER_TEMP/base-$f.json" \
              || echo '{"names": {}}' > "$RUNNER_TEMP/base-$f.json"
          done
          {
            echo "PENDING=--pending $RUNNER_TEMP/pending-top_domains_dead.json --pending-base $RUNNER_TEMP/base-top_domains_dead.json"
            echo "PENDING_BAND=--pending $RUNNER_TEMP/pending-top_1m_dead.json --pending-base $RUNNER_TEMP/base-top_1m_dead.json"
          } >> "$GITHUB_ENV"

      - name: Sweep the lists
        id: sweep
        run: |
          set +e
          # shellcheck disable=SC2086 # PENDING is two words or none
          python3 scripts/refresh_dead_top_names.py --report "$RUNNER_TEMP/dead-report.md" $PENDING
          code=$?
          set -e
          cat "$RUNNER_TEMP/dead-report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          # 3: nothing new, but tombstoned names resolve again.
          if [ "$code" -eq 3 ]; then echo "revived=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$code"

      - name: Build the top-1M ranking
        id: ranking
        continue-on-error: true
        run: python3 scripts/refresh_tranco.py --dry-run --dump "$RUNNER_TEMP/ranking.json"

      - name: Sweep ranks 100k-1M
        if: steps.ranking.outcome == 'success'
        id: band
        continue-on-error: true
        timeout-minutes: 240
        env:
          MAX_NEW_BAND: ${{ inputs.max_new_band }}
        run: |
          cap=()
          if [ -n "$MAX_NEW_BAND" ]; then cap=(--max-new "$MAX_NEW_BAND"); fi
          # shellcheck disable=SC2086 # PENDING_BAND is four words or none
          python3 scripts/refresh_dead_top_names.py --ranking "$RUNNER_TEMP/ranking.json" "${cap[@]}" \
            --report "$RUNNER_TEMP/band-report.md" $PENDING_BAND
          { echo; cat "$RUNNER_TEMP/band-report.md"; } >> "$RUNNER_TEMP/dead-report.md"
          cat "$RUNNER_TEMP/band-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Say when ranks 100k-1M were not swept
        if: steps.ranking.outcome != 'success' || steps.band.outcome != 'success'
        run: |
          msg="Ranks 100k-1M were not swept this week (ranking: ${{ steps.ranking.outcome }}, sweep: ${{ steps.band.outcome }}); the top lists were."
          echo "::warning::$msg"
          { echo; echo "**Note:** $msg"; } >> "$RUNNER_TEMP/dead-report.md"
          git checkout -- data/top_1m_dead.json 2>/dev/null || true
          # The open PR's band tombstones stay in the replacement PR (no DNS).
          # shellcheck disable=SC2086 # PENDING_BAND is four words or none
          if [ -n "${PENDING_BAND:-}" ]; then
            python3 scripts/refresh_dead_top_names.py --carry-only --out data/top_1m_dead.json $PENDING_BAND
          fi

      - name: Rebuild the phone's veto
        run: python3 scripts/build_mobile_assets.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet data/top_domains_dead.json data/top_1m_dead.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # CI's own test run: CI does not run on a PR this token opens.
      - name: Run the test suite as CI does
        if: steps.diff.outputs.changed == 'true'
        env:
          DEBUG: "true"
          SUPABASE_JWT_SECRET: "test-secret-for-development-only-not-for-production-use"
        run: python3 -m pytest -q tests/

      - name: Open PR with the new tombstones
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.BRANCH }}
          delete-branch: true
          commit-message: 'chore(data): tombstone popular names that stopped existing'
          title: 'chore(data): tombstone popular names that stopped existing'
          body-path: ${{ runner.temp }}/dead-report.md
          add-paths: |
            data/top_domains_dead.json
            data/top_1m_dead.json
            mobile/modules/cleanway-vpn/android/src/main/assets/popular_veto.txt

      - name: Ask a person about the revived names
        if: steps.sweep.outputs.revived == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Tombstoned popular names resolve again — check who holds them"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$RUNNER_TEMP/dead-report.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/dead-report.md"
          fi
