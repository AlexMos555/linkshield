name: 'Tombstone dead popular names'

# Weekly sweep of every name of data/top_100k.json and
# data/top_domains_reported.json: one both Cloudflare and Google answer
# NXDOMAIN for, and whose parent zone has no delegation for, is added to
# data/top_domains_dead.json, which takes all the lists' trust from it
# (api/services/dead_top_names.py) before anyone can buy it — a name stays
# NXDOMAIN for weeks between its expiry and its release. The phone's veto
# (popular_veto.txt) is rebuilt in the same PR.
#
# The rest of the top-1M ranking (ranks 100k-1M, rebuilt here as the daily
# rank refresh builds it) is swept into data/top_1m_dead.json by a job of
# its own, on a runner of its own: when it fails, the top lists' tombstones
# still ship. Both sweeps stop in time and keep what they swept
# (--time-limit): on 2026-10-31 1.1.1.1 answered a runner ten times slower
# in the evening than in the afternoon, and one job doing both ran out of
# its time before the band began.
#
# Opens a PR; humans review before merging. CI does not run on a PR this
# token opens, so the checks CI would run on these files run here, before
# the PR. Names that resolve again stay tombstoned: they are listed in the
# PR, or in an issue when nothing new died, for a person to check who holds
# them now.

on:
  schedule:
    # Wednesday 04:53 UTC — away from the daily ranks (03:17) and the
    # Sunday favicon refresh (04:42).
    - cron: '53 4 * * 3'
  workflow_dispatch:
    inputs:
      max_new_band:
        description: 'Cap on new ranks 100k-1M tombstones (empty: the script default; for a bootstrap run)'
        required: false
        default: ''

# Read-only by default; the one job that opens the PR gets write.
permissions:
  contents: read

# Two runs at once would each replace the other's PR.
concurrency:
  group: refresh-dead-top-names
  cancel-in-progress: false

env:
  BRANCH: cleanway/refresh-dead-top-names

jobs:
  # The open PR of an earlier run is replaced by this run's: the names it
  # adds are carried over, never dropped. Only what it adds against the
  # commit it branched from (its merge base with main, whatever commits a
  # person added on top), and only while it is open and ours (not a fork's):
  # a merged or closed one, or a line removed on main by hand, never comes
  # back. Fetched once, for both sweeps and the PR.
  pending:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      found: ${{ steps.fetch.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch an open sweep PR's tombstones
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then exit 0; fi           # no such branch
          if [ "$code" -ne 0 ]; then exit "$code"; fi     # cannot tell: stop, do not drop
          open=$(gh pr list --head "$BRANCH" --state open --json isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)] | length')
          if [ "$open" = "0" ]; then exit 0; fi
          git fetch --depth=1 origin "$BRANCH"
          head=$(git rev-parse FETCH_HEAD)
          base=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$BRANCH" --jq .merge_base_commit.sha)
          git fetch --depth=1 origin "$base"
          mkdir -p "$RUNNER_TEMP/pending"
          for f in top_domains_dead top_1m_dead; do
            git show "$head:data/$f.json" > "$RUNNER_TEMP/pending/pending-$f.json" \
              || echo '{"names": {}}' > "$RUNNER_TEMP/pending/pending-$f.json"
            git show "$base:data/$f.json" > "$RUNNER_TEMP/pending/base-$f.json" \
              || echo '{"names": {}}' > "$RUNNER_TEMP/pending/base-$f.json"
          done
          echo "found=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fetch.outputs.found == 'true'
        with:
          name: pending
          path: ${{ runner.temp }}/pending/
          if-no-files-found: error
          retention-days: 7  # a re-run of the failed jobs within the week

  lists:
    needs: pending
    runs-on: ubuntu-latest
    # As long as the band's: the PR waits for both anyway.
    timeout-minutes: 350
    outputs:
      revived: ${{ steps.sweep.outputs.revived }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.pending.outputs.found == 'true'
        with:
          name: pending
          path: ${{ runner.temp }}/pending

      - name: Sweep the lists
        id: sweep
        timeout-minutes: 320
        run: |
          pending=()
          if [ -f "$RUNNER_TEMP/pending/pending-top_domains_dead.json" ]; then
            pending=(--pending "$RUNNER_TEMP/pending/pending-top_domains_dead.json"
                     --pending-base "$RUNNER_TEMP/pending/base-top_domains_dead.json")
          fi
          mkdir -p "$RUNNER_TEMP/out"
          set +e
          python3 scripts/refresh_dead_top_names.py --time-limit 300 \
            --report "$RUNNER_TEMP/out/lists-report.md" "${pending[@]}"
          code=$?
          set -e
          cat "$RUNNER_TEMP/out/lists-report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if grep -q "(out of time" "$RUNNER_TEMP/out/lists-report.md" 2>/dev/null; then
            echo "::warning::The top lists were swept in part this week: $(head -1 "$RUNNER_TEMP/out/lists-report.md")"
          fi
          # 3: nothing new, but tombstoned names resolve again.
          if [ "$code" -eq 3 ]; then echo "revived=true" >> "$GITHUB_OUTPUT"; code=0; fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          cp data/top_domains_dead.json "$RUNNER_TEMP/out/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lists
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7  # a re-run of the failed jobs within the week

  band:
    needs: pending
    runs-on: ubuntu-latest
    # A hosted runner's most is 6 hours.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.pending.outputs.found == 'true'
        with:
          name: pending
          path: ${{ runner.temp }}/pending

      - name: Build the top-1M ranking
        run: python3 scripts/refresh_tranco.py --dry-run --dump "$RUNNER_TEMP/ranking.json"

      # The band leaves the top lists' tombstones out: main's, and those the
      # open PR adds (the lists job carries them over on its own runner).
      - name: Gather the top lists' tombstones
        run: |
          cp data/top_domains_dead.json "$RUNNER_TEMP/top-dead.json"
          if [ -f "$RUNNER_TEMP/pending/pending-top_domains_dead.json" ]; then
            python3 scripts/refresh_dead_top_names.py --carry-only --out "$RUNNER_TEMP/top-dead.json" \
              --pending "$RUNNER_TEMP/pending/pending-top_domains_dead.json" \
              --pending-base "$RUNNER_TEMP/pending/base-top_domains_dead.json"
          fi

      - name: Sweep ranks 100k-1M
        timeout-minutes: 320
        env:
          MAX_NEW_BAND: ${{ inputs.max_new_band }}
        run: |
          cap=()
          if [ -n "$MAX_NEW_BAND" ]; then cap=(--max-new "$MAX_NEW_BAND"); fi
          pending=()
          if [ -f "$RUNNER_TEMP/pending/pending-top_1m_dead.json" ]; then
            pending=(--pending "$RUNNER_TEMP/pending/pending-top_1m_dead.json"
                     --pending-base "$RUNNER_TEMP/pending/base-top_1m_dead.json")
          fi
          mkdir -p "$RUNNER_TEMP/out"
          python3 scripts/refresh_dead_top_names.py --ranking "$RUNNER_TEMP/ranking.json" --time-limit 300 \
            --top-dead "$RUNNER_TEMP/top-dead.json" "${cap[@]}" --report "$RUNNER_TEMP/out/band-report.md" \
            "${pending[@]}"
          cat "$RUNNER_TEMP/out/band-report.md" >> "$GITHUB_STEP_SUMMARY"
          if grep -q "(out of time" "$RUNNER_TEMP/out/band-report.md"; then
            echo "::warning::Ranks 100k-1M were swept in part this week: $(head -1 "$RUNNER_TEMP/out/band-report.md")"
          fi
          cp data/top_1m_dead.json "$RUNNER_TEMP/out/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: band
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7  # a re-run of the failed jobs within the week

  pr:
    needs: [pending, lists, band]
    # The band may have failed: the top lists' tombstones ship without it.
    # Not when a person cancelled the run.
    if: ${{ !cancelled() && needs.lists.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.pending.outputs.found == 'true'
        with:
          name: pending
          path: ${{ runner.temp }}/pending

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lists
          path: ${{ runner.temp }}/lists

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.band.result == 'success'
        with:
          name: band
          path: ${{ runner.temp }}/band

      - name: Put the sweeps' files in place
        env:
          BAND_RESULT: ${{ needs.band.result }}
        run: |
          cp "$RUNNER_TEMP/lists/top_domains_dead.json" data/
          cp "$RUNNER_TEMP/lists/lists-report.md" "$RUNNER_TEMP/dead-report.md"
          if [ "$BAND_RESULT" = "success" ]; then
            cp "$RUNNER_TEMP/band/top_1m_dead.json" data/
            { echo; cat "$RUNNER_TEMP/band/band-report.md"; } >> "$RUNNER_TEMP/dead-report.md"
            exit 0
          fi
          msg="Ranks 100k-1M were not swept this week (the band job: $BAND_RESULT); their tombstones on main stay."
          echo "::warning::$msg"
          { echo; echo "**Note:** $msg"; } >> "$RUNNER_TEMP/dead-report.md"
          # The open PR's band tombstones stay in the replacement PR (no DNS).
          if [ -f "$RUNNER_TEMP/pending/pending-top_1m_dead.json" ]; then
            python3 scripts/refresh_dead_top_names.py --carry-only --out data/top_1m_dead.json \
              --pending "$RUNNER_TEMP/pending/pending-top_1m_dead.json" \
              --pending-base "$RUNNER_TEMP/pending/base-top_1m_dead.json"
          fi

      - name: Rebuild the phone's veto
        run: python3 scripts/build_mobile_assets.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet data/top_domains_dead.json data/top_1m_dead.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # CI's own test run: CI does not run on a PR this token opens.
      - name: Run the test suite as CI does
        if: steps.diff.outputs.changed == 'true'
        env:
          DEBUG: "true"
          SUPABASE_JWT_SECRET: "test-secret-for-development-only-not-for-production-use"
        run: python3 -m pytest -q tests/

      - name: Open PR with the new tombstones
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.BRANCH }}
          delete-branch: true
          commit-message: 'chore(data): tombstone popular names that stopped existing'
          title: 'chore(data): tombstone popular names that stopped existing'
          body-path: ${{ runner.temp }}/dead-report.md
          add-paths: |
            data/top_domains_dead.json
            data/top_1m_dead.json
            mobile/modules/cleanway-vpn/android/src/main/assets/popular_veto.txt

      - name: Ask a person about the revived names
        if: needs.lists.outputs.revived == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Tombstoned popular names resolve again — check who holds them"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$RUNNER_TEMP/dead-report.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/dead-report.md"
          fi
