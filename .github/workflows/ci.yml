name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      SUPABASE_JWT_SECRET: "test-secret-for-development-only-not-for-production-use"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=50

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Run benchmark (if PhishTank data available)
        run: |
          if [ -f data/phishtank.csv ]; then
            python -m tests.benchmark_scoring
          else
            echo "PhishTank data not available, skipping benchmark"
          fi

      - name: Set up Node (for TS package tests)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test api-client error mapping
        # Pins the typed-error contract that mobile + landing + extensions
        # all rely on. Uses node's built-in TS stripper — no test runner needed.
        run: npm run test:api-client

      - name: Turnstile captcha-page helpers
        # /auth/captcha hands the mobile app a cleanway:// deep link. This pins
        # that the link is only ever built from an allowlisted scheme + the
        # app's 32-hex nonce, and that the always-pass test sitekey is flagged.
        run: node --experimental-strip-types scripts/test-turnstile-lib.mjs

      - name: Landing honesty helpers
        # What the site may claim: no accuracy % from a too-small benchmark
        # sample (incl. the committed latest.json), no paid plans for Russian
        # visitors, no support address until the mailbox works, install
        # screenshots only when the file exists, reason labels in sync with
        # the app's.
        run: node --experimental-strip-types scripts/test-landing-honesty.mjs

      - name: Signup + extension-connect helpers
        # /signup's code flow, the /auth/callback error hand-off, the
        # allowlisted ?next= (the extension's connect page keeps its state
        # through sign-in; nothing else rides along) and the connect page's
        # decisions (landing/lib/extension-connect.ts).
        run: node --experimental-strip-types scripts/test-signup-flow.mjs

      - name: Extension local-scorer table test
        # The offline scorer draws the badge before (and sometimes instead of)
        # any backend verdict, so it is a fork of api/services/scoring.py that
        # has drifted before (2026-07-20 QA: brand-subdomain and glyph bugs
        # the backend had already fixed). This table pins the punycode/IDN
        # decisions against the Python implementation, and holds the ported
        # name rules (src/utils/name-rules.js) to the server's answers on
        # every row of tests/data/extension_name_rules_parity.tsv (generated,
        # and kept current by tests/test_extension_scorer_data.py). It runs
        # against all four extension trees, so a hand-edit to a generated
        # copy fails too.
        run: node scripts/test-local-scorer.mjs

      - name: Extension static checks (trust list, SW module graph, i18n keys)
        # The background was a classic service worker calling import(), which
        # service workers forbid: the threat counter, Family Hub alerts and
        # poller, and the 30-day history prune silently never ran. This fails
        # if anything the background can reach calls import()/importScripts(),
        # if the "known safe" shortcut trusts a user-content host
        # (sites.google.com, forms.yandex.ru, *.wordpress.com...), or if an
        # i18n key the extension uses is missing from any locale. The real-
        # browser proof is .github/workflows/e2e-extension.yml.
        run: node scripts/test-extension-core.mjs

      - name: Extension sign-in (token handoff + refresh)
        # cleanway.ai/extension/connect → content/connect-relay.js →
        # background. Pins who may hand over tokens (exact origin, connect
        # path, top frame, our own content script), the one-time 30-minute
        # state, what gets stored, and that a refresh is single-flight, goes
        # only to our Supabase project and signs out only when Supabase
        # refuses the refresh token.
        run: node scripts/test-extension-auth.mjs

      - name: Extension build drift guard
        # `packages/extension-core/` is the single source of truth.
        # `scripts/build-extensions.sh` fans the files out to
        # extension/, extension-firefox/, extension-safari/ with the
        # browser-specific shims layered on top. If a developer edits
        # the source but forgets to rebuild, the three browser ZIPs
        # ship stale and the bug-fix only lands in Chrome (or vice
        # versa). Run the build inside CI and fail if any tracked
        # file changed — that's our signal to rebuild locally.
        # (Audit extension-build HIGH.)
        run: |
          bash scripts/build-extensions.sh > /dev/null 2>&1
          # build-extensions.sh also runs scripts/build-i18n.py, which
          # regenerates landing/messages/ + mobile/i18n/ from the
          # packages/i18n-strings/ source of truth. Include those in the
          # drift check — the original guard only diffed the extension
          # trees, so a hand-edit to landing/messages/*.json (e.g. the
          # Methodology namespace, or a badge-copy change) that wasn't
          # mirrored back into the source would silently regress on the
          # next build. (2026-07-01: exactly this happened three times.)
          # Stage first so `git diff --cached` also sees NEW untracked
          # generated files (a fresh locale or _locales entry the build
          # produces but the committer forgot to add) — a plain
          # `git diff --exit-code` on the working tree ignores untracked
          # files and would pass a build that emitted a new uncommitted file.
          git add -A -- 'extension/' 'extension-firefox/' 'extension-safari/' 'landing/messages/' 'mobile/i18n/' 'mobile/modules/cleanway-vpn/android/src/main/res/'
          if ! git diff --cached --exit-code -- 'extension/' 'extension-firefox/' 'extension-safari/' 'landing/messages/' 'mobile/i18n/' 'mobile/modules/cleanway-vpn/android/src/main/res/'; then
            echo "::error::Generated i18n/extension artifacts are out of sync with their source (packages/extension-core/ + packages/i18n-strings/). Edit the SOURCE, then run 'bash scripts/build-extensions.sh' locally and commit the regenerated files."
            exit 1
          fi

  mobile:
    # The mobile app has no test runner wired up, but three cheap static
    # gates have each caught a shipped bug this quarter:
    #   - tsc under tsconfig.typecheck.json (the dual-@types/react pin)
    #   - the i18n contract check (the scanner shipped with its whole
    #     namespace missing and rendered raw dotted keys on the camera-
    #     permission screen)
    #   - the host-parser table (an earlier parser rewrote the homograph
    #     "пaypal.com" into the real domain "aypal.com" via a \b anchor)
    # The Kotlin VPN unit tests are NOT run here: mobile/android is expo
    # prebuild output that lives outside the repo, so they run in the local
    # dev sandbox instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Mobile typecheck
        run: npx tsc -p mobile/tsconfig.typecheck.json --noEmit

      - name: Mobile i18n contract
        run: python3 scripts/check-mobile-i18n.py

      # The Expo config plugins rewrite android/app/build.gradle on every
      # prebuild, and the generated tree is not in git. A regression there means
      # a debug-signed or needlessly fat release APK with a green build either
      # way — so the transforms are asserted here, in CI, not by hand.
      - name: Expo config plugins (release signing + ABI filters)
        run: node mobile/plugins/__tests__/plugins.test.js

      - name: Host parser table test
        run: node mobile/scripts/test-host-parser.mjs

      - name: Message check vocabulary asset
        # message_rules.json is hand-edited; a parse error or a renamed group
        # ships an APK whose text check is silently off. The Kotlin tests that
        # would catch it do not run in CI, so the asset is checked here.
        run: node mobile/scripts/check-message-rules.mjs

      - name: Message check result parser table test
        # The native analyzeMessage() map is validated in JS; an unknown
        # verdict must read as "could not check", never as a verdict.
        run: node mobile/scripts/test-message-analysis.mjs

      - name: Message check verdict table test
        # Which link hosts may leave the phone (never a shortener, a shared
        # system host such as docs.google.com, an IP or more than 3), how
        # server answers fold into the on-device verdict (they can only raise
        # it), when a calm verdict must say a link is still unchecked, and
        # bare link vs message share routing.
        run: node mobile/scripts/test-message-verdict.mjs

      - name: History model table test
        # Each home counter opens History on a filter; the filter must list
        # exactly what the counter adds up. Also pins that old block-log
        # entries (no source) still read, and that the public deep link opens
        # nothing for a site that is not in the log.
        run: node mobile/scripts/test-history-model.mjs

      - name: Link check verdict table test
        # A site on the on-device list is "dangerous" at once and no server
        # answer can downgrade it; a name that does not exist is never scored
        # as a scam; a slow first check is retried once, a rate limit never.
        run: node mobile/scripts/test-check-verdict.mjs

      - name: Sign-in error text table test
        # A failed code request or code check shows a translated sentence,
        # never GoTrue's English: captcha, rate limit, offline, wrong code.
        run: node --experimental-strip-types mobile/scripts/test-auth-error-key.mjs

      - name: Account session table test
        # The token is refreshed before it expires, one refresh at a time
        # (GoTrue rotates the refresh token); device_revoked signs out,
        # device_limit_reached offers "unlink one"; every plan / source /
        # platform the API sends has a label.
        run: node --experimental-strip-types mobile/scripts/test-account-session.mjs

      - name: Free plan daily-limit table test
        # EXPO_PUBLIC_FREEMIUM_ENABLED (off by default): 3 detailed checks a
        # day reset at local midnight, 7 unlimited days after install, a paid
        # account unlimited (7-day offline grace), the paywall opening by
        # itself once a day, a listed link still "dangerous" after the limit,
        # and a store build never linking out to the web checkout.
        run: node --experimental-strip-types mobile/scripts/test-freemium.mjs

      - name: Google Play billing (RevenueCat) table test
        # Only the Play build with a public goog_ key pays in the app (the
        # site APK and RuStore never load or link the SDK); the plan sold is
        # cleanway.devices monthly/yearly at the store's own price, never the
        # "+1 device" add-on; store errors (cancel, pending, already owned,
        # offline) read as sentences in all 10 locales; a store build opens
        # only a store's subscriptions page; deleting the account sends a
        # Play subscriber to cancel in Play first.
        run: node --experimental-strip-types mobile/scripts/test-store-billing.mjs

      - name: iPhone platform gating + App Store shape table test
        # The iPhone never shows Android-only protection (VPN shield, keep-alive,
        # link guard, call guard); it lists its own layers (Safari, scam texts,
        # DNS) as "coming soon" until a build reports one. The iOS config stays
        # App Store-shaped: no VPN or push entitlement, no unused usage strings,
        # export compliance, a privacy manifest, the native pod not above the
        # deployment target, the share extension's hand-off URL routed home.
        run: node --experimental-strip-types mobile/scripts/test-platform-gating.mjs

      - name: iPhone scam-text filter table test
        # The SMS row says "Set up" when the build carries the filter and never
        # "On" (iOS gives the app no enabled-state API); the setup steps exist in
        # all 10 locales; the server's switches reach the extension through the
        # app group; the plugin's target, bundle id, app group and EAS entry.
        run: node --experimental-strip-types mobile/scripts/test-ios-sms-filter.mjs

      - name: iPhone scam-text filter parity fixture is current
        # The Swift filter engine must give the Kotlin engine's verdicts; its
        # tests replay a fixture the Kotlin engine wrote. This re-hashes every
        # input of that fixture (engine sources, rules, model, corpora) so a
        # change on either side cannot ship without regenerating it, and pins
        # the extension offline-only (no network deferral, no network URL).
        run: node mobile/scripts/check-ios-parity-fixture.mjs

      - name: iPhone DNS protection (NEDNSSettingsManager) table test
        # The DNS layer is "on" only when iOS says our configuration is saved,
        # current and enabled — an odd native value is never on. The setup
        # sheet follows iOS's two steps (the app saves it, the person picks it
        # in Settings), says first that site names go to Cleanway's server,
        # and the Swift side saves DoH to the /dns-query gateway the API
        # serves, with no pinned IPs and no on-demand rules. docs/IOS.md §4.
        run: node --experimental-strip-types mobile/scripts/test-ios-dns.mjs

      - name: Remote config (SMS text model kill switch) table test
        # The server can turn the on-device SMS text model off without an APK.
        # An answer without a valid block keeps the stored switches (an outage
        # never flips one); the app asks on start, ~daily while open, never
        # twice an hour; and the keys match RemoteConfig.kt and the API — the
        # Kotlin side's own tests do not run in CI.
        run: node --experimental-strip-types mobile/scripts/test-remote-config.mjs

      - name: Reason label table test
        # Every reason code the app maps has its label in all 10 locales, and
        # the codes the API's verdict_basis release adds read in Russian —
        # not as the server's English sentence under a Russian verdict.
        run: node mobile/scripts/test-reason-label.mjs

      - name: Link check hook regression test
        # useDomainCheck under real React 18: a second link shared to the open
        # /shared screen is saved and buzzed under its own name, never the
        # previous site's; a listed site reaches History even when the screen
        # closes before the server answers.
        run: node mobile/scripts/test-domain-check-hook.mjs

      - name: Network shield hook regression test
        # useNetworkShield under real React 18: the home screen follows the
        # service's pause (resume, the notification's "turn back on") and the
        # phone's connection while it stays open — 1.0.2 kept «на паузе» and
        # «Нет сети» long after either had changed.
        run: node mobile/scripts/test-network-shield-hook.mjs

      - name: Keep-protection-on table test
        # The "Keep protection on" list ticks a row only when the phone
        # reports it: an odd native value is "cannot tell", never done; the
        # phone maker's own battery manager is never ticked; and every
        # template-literal key the card builds exists in all 10 locales.
        run: node mobile/scripts/test-keep-alive.mjs

      - name: Shared message handoff regression test
        # Report #5: a second SMS shared to an open message screen must be
        # checked — the router reuses the screen, so each share needs its id.
        run: node mobile/scripts/test-message-handoff.mjs

      - name: Android permission guard
        # The browser-downloaded APK never asks for SMS, phone-state,
        # call-log, call-answering, call-screening, notification-listener,
        # accessibility or overlay permissions — call awareness is the audio
        # mode alone (CallState.kt). Checks app.json, the native module's
        # manifest and Kotlin, and the config plugins. The Kotlin twin
        # (PolicyGuardTest) runs only in the local build sandbox.
        run: node mobile/scripts/check-android-permissions.mjs

      - name: Call stop-screen table test
        # When the stop screen applies (in a call, 30 minutes after one, and
        # never on a build that cannot see calls), the 5-second slow path a
        # clock step cannot shorten, and merging the module's call events.
        run: node mobile/scripts/test-call-guard.mjs

      - name: Call state hook regression test
        # useCallState under real React 18: a call already going on is seen
        # at open, the window after a call closes by itself, the foreground
        # re-reads the phone, and nothing is claimed where calls cannot be seen.
        run: node mobile/scripts/test-call-state-hook.mjs

      - name: Captcha service unit tests
        # Pins the deep-link contract with /auth/captcha: https-only URL,
        # nonce must match, timeout/grace/cancel resolve null exactly once.
        # node:test module mocks stand in for react-native; no runner needed.
        run: node --experimental-test-module-mocks --experimental-strip-types mobile/scripts/test-captcha-service.mjs

      - name: Mobile blocklist assets in sync with data/
        # popular_veto.txt / shared_suffixes.txt gate the on-device
        # false-positive veto. Deterministic from committed data files (no
        # network): a hand-edit or a data refresh that skipped the rebuild
        # ships a wrong veto — github.io un-blockable, or a legit brand
        # blocked. Rebuild: python3 scripts/build_mobile_assets.py
        run: python3 scripts/build_mobile_assets.py --check

      - name: Public-suffix set still consistent with top_100k
        # Offline invariant only (no PSL fetch), so an upstream PSL edit does
        # not redden unrelated PRs; the refresh job runs the full --check.
        run: python3 scripts/build_public_suffixes_in_top.py --verify-consistency

  ios-sms-engine:
    # The iPhone scam-text filter's engine (mobile/targets/sms-filter, Swift)
    # replays what the Kotlin engine says about every corpus message — 2,400+
    # messages under three server configs — and must give the same verdict
    # and reasons; plus its memory/speed budget and the kill switch. Pure
    # Swift + Foundation, so `swift test` on a Mac runner, no simulator.
    # Release: the debug build is ~40x slower on this engine.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Swift parity tests (Kotlin fixture)
        working-directory: mobile/targets/sms-filter
        run: swift test -c release

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.8.6

      - name: Lint
        run: ruff check api/ tests/ ml/

      - name: i18n parity (non-EN locales must ship every en.json namespace)
        # Catches the silent-fallback failure mode that bit /transparency/methodology
        # in commit 04c08a0: a new namespace landed in en.json only; 9 non-EN
        # locales rendered raw keys (e.g. `Methodology.page_title`) for ~10 days
        # before anyone noticed.
        run: python3 scripts/check-i18n-parity.py

      - name: Extension asset-path guard
        # Fails CI if any chrome.runtime.getURL(...) call or <script src=...>
        # in any of the 4 extension trees points at a file that isn't on
        # disk. Caught by the 2026-07-01 pre-launch audit as a class of bug
        # that had shipped 3 times: the utils/ vs src/utils/ ext-01 sweep,
        # the options.html vendor-script ext-02 sweep, and the family
        # notifier's dangling icon-192.png path. See
        # scripts/check-extension-paths.py.
        run: python3 scripts/check-extension-paths.py

      - name: Stale-claim regression guard
        # Fails CI if any of the pre-recalibration marketing anchors sneak
        # back in (the inflated AUC, the older detection-rate percentage, the
        # rounded training-sample count). See scripts/check-stale-claims.py
        # for the exact forbidden patterns and the validated replacements
        # committed after the 2026-06-17 validation pass. A future PR can't
        # accidentally re-introduce the older, inflated copy.
        run: python3 scripts/check-stale-claims.py

      - name: Landing claims guard
        # The 2026-09-25 service check found the Russian landing promising
        # things the product does not do: "browsing history never leaves your
        # device", "works alongside NordVPN", "Add to Chrome" with no listing,
        # "Google Play soon", hand-written transparency numbers, literal
        # $DATE$ placeholders. See scripts/check-landing-claims.py.
        run: python3 scripts/check-landing-claims.py

  openapi-drift:
    # Pin the whole generated packages/api-types/ to the live FastAPI app.
    # If a PR adds a route or schema but forgets to run `npm run build:api-types`,
    # this job fails so the stale spec doesn't leak into the typed clients.
    #
    # Both generated artifacts are gated, not just the JSON. This job used to
    # run dump-openapi.py alone, which left src/openapi.d.ts — the file that
    # landing/, mobile/ and packages/api-client/ actually import — invisible to
    # CI. It drifted unnoticed for ~10 weeks (missing GET /api/v1/blocklist/dns
    # and GET /api/v1/mobile/version, plus 19 properties still typed optional
    # after --properties-required-by-default was added to the generator). So we
    # now run the same single entry point contributors are told to run and diff
    # everything it writes.
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      SUPABASE_JWT_SECRET: "test-secret-for-development-only-not-for-production-use"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      # requirements.txt pins fastapi — the spec's exact shape depends on it
      # (0.128 emits `format: binary` for UploadFile where 0.137 emits
      # `contentMediaType`), so regenerating against anything else produces a
      # file that is "fresh" locally and still red here.
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Regenerate api-types (spec + TypeScript)
        run: npm run build:api-types
      - name: Verify generated api-types match the committed ones
        run: |
          if ! git diff --exit-code -- packages/api-types; then
            echo ""
            echo "ERROR: packages/api-types is out of date — the committed"
            echo "OpenAPI spec and/or generated types do not match the app."
            echo "Regenerate with:  npm run build:api-types"
            echo "then commit packages/api-types/schema/openapi.json and"
            echo "packages/api-types/src/openapi.d.ts."
            exit 1
          fi

  # Docker build job disabled — we removed the Dockerfile (commit 208efd2)
  # so Railway uses Nixpacks + Procfile. Railway's build on every push is
  # effectively this job's replacement. Re-enable if we reintroduce Docker.
  docker:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Docker build disabled — Nixpacks is the builder now."
