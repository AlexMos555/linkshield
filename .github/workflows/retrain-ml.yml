name: Retrain phishing ML model (weekly)

# Turns the frozen ML artifact into a living, self-updating model.
# Before 2026-07-06 nothing retrained it and the training feed was a frozen
# April snapshot — a retrain just re-learned April's phish. This job pulls FRESH
# phishing (URLhaus full + OpenPhish) + Tranco benign, retrains, health-gates on
# AUC, exports ONNX, and commits the new model so prod picks it up on next deploy.
#
# Weekly (Mon 05:00 UTC). Manual runs via workflow_dispatch.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write   # commits the retrained model artifacts

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install training deps
        run: |
          pip install --upgrade pip
          # Backend deps (pydantic, etc.) — train_model.py imports api.services.*
          pip install -r requirements.txt
          # Training-only deps not shipped to prod
          pip install catboost==1.2.10 scikit-learn

      - name: Refresh training feeds (fresh phishing + Tranco)
        run: python scripts/refresh_training_feeds.py

      - name: Retrain (exports .cbm + .onnx + meta)
        run: PYTHONPATH=. python ml/train_model.py

      - name: Health-gate on AUC (refuse to ship a broken model)
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("data/model_meta.json"))
          auc = float(m.get("test_auc", 0))
          n = int(m.get("total_samples", 0))
          print(f"retrained: AUC={auc} total_samples={n}")
          if auc < 0.85 or n < 10000:
              print("::error::retrain failed health gate (AUC<0.85 or n<10000) — NOT committing")
              sys.exit(1)
          PY

      - name: Regression gate (FP + recall must not regress)
        run: |
          PYTHONPATH=. python - <<'PY'
          from api.services.ml_scorer import ml_predict, backend_status
          assert backend_status() in ("onnx", "catboost"), "model did not load"
          # FP-regression guard: legit long-tail domains that a retrain must keep
          # low (the whole point of the 2026-07-06 retrain fix — never re-ship a
          # model that flags klar.mx / gob.mx / mercadolibre as phishing).
          legit = ["klar.mx", "konfio.mx", "gob.mx", "mercadolibre.com.mx",
                   "leadgid.com", "banorte.com", "google.com", "wikipedia.org"]
          bad = {d: ml_predict(d)["phishing_probability"] for d in legit
                 if ml_predict(d)["phishing_probability"] >= 0.5}
          assert not bad, f"::error::FP REGRESSION — retrained model over-flags legit: {bad}"
          # Subdomain guard: a subdomain is not phishing by itself. Before the
          # host-shape stratum (ml/train_model.load_benign_domains) the model
          # scored www.example.com 0.98 and docs.google.com 0.91.
          shapes = ["www.example.com", "docs.google.com", "mail.yandex.ru", "online.sberbank.ru"]
          bad = {d: ml_predict(d)["phishing_probability"] for d in shapes
                 if ml_predict(d)["phishing_probability"] >= 0.5}
          assert not bad, f"::error::FP REGRESSION — retrained model flags subdomains: {bad}"
          # Tenant guard: a site on a hosting platform is judged by its own
          # name. Until the tenant stratum (2026-10-04) the benign class had no
          # tenant at all and the model scored facebook.github.io 0.96 and
          # blog.wordpress.com 0.95 — every GitHub Pages, WordPress.com and
          # Shopify site was 'ml_high_risk'.
          tenants = ["facebook.github.io", "malsup.github.io", "blog.wordpress.com",
                     "official-shop.myshopify.com", "myshop.tw1.ru", "metamask.github.io"]
          bad = {d: ml_predict(d)["phishing_probability"] for d in tenants
                 if ml_predict(d)["phishing_probability"] >= 0.5}
          assert not bad, f"::error::FP REGRESSION — retrained model flags hosting tenants: {bad}"
          # Recall guard: obvious brand-subdomain / structural phishing must fire,
          # and so must a lure name on a hosting platform (the tenant's label is
          # what the model reads).
          for d in ("paypal.account-verify.tk", "apple-id-locked-verify.xyz",
                    "gosuslugi-vhod.netlify.app", "secure-login.wasmer.app", "sberbank-online.pages.dev"):
              p = ml_predict(d)["phishing_probability"]
              assert p > 0.6, f"::error::RECALL REGRESSION — {d}={p} (obvious phishing missed)"
          print("regression gate OK — FP clean + obvious phishing caught")
          PY

      - name: Held-out Russian gate (the model must not be what flags a legit Russian site)
        run: |
          PYTHONPATH=. python - <<'PY'
          # tests/data/ru_heuristics_*.txt are held out of training
          # (ml/train_model.HELD_OUT_FILES). The name heuristics alone leave
          # 0 dangerous / 1 caution on LEGIT; the 2026-09-28 model added 21
          # cautions and a dangerous one (*.gov.spb.ru, 'ml_high_risk'); the
          # 2026-10-04 model (features_version 5) adds none and PHISH is 147/174.
          import sys
          sys.path.insert(0, "scripts")
          from eval_ru_heuristics import run
          r = run(ml=True)
          legit = r["legit"]["summary"]["levels"]
          by_ml = [row["host"] for row in r["legit"]["rows"]
                   if row["level"] != "safe" and any(s.startswith("ml_") for s in row["signals"])]
          phish = r["phish"]["summary"]["levels"]
          print(f"LEGIT {legit}  flagged with an ML signal: {by_ml}")
          print(f"PHISH caught {phish['caution'] + phish['dangerous']} of {r['phish']['summary']['n']}")
          assert legit["dangerous"] == 0, "::error::a held-out legitimate Russian site is dangerous"
          assert len(by_ml) <= 3, f"::error::FP REGRESSION — the model flags {len(by_ml)} held-out Russian sites"
          PY

      - name: Commit new model if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/phishing_model.cbm data/phishing_model.onnx data/model_meta.json
          if git diff --cached --quiet; then
            echo "Model unchanged — nothing to commit."
          else
            AUC=$(python -c "import json;print(json.load(open('data/model_meta.json'))['test_auc'])")
            git commit -m "chore(ml): weekly retrain on fresh feeds (AUC ${AUC})"
            git push
          fi
