name: Weekly fresh-URL benchmark (recall transparency)

# Once a week, fetch the latest URLhaus + PhishTank phishing feeds,
# run them through cleanway.ai/api/v1/public/check + Cloudflare
# 1.1.1.1 for Families + (when keys are configured) Google Safe
# Browsing + VirusTotal aggregate, and publish the results.
#
# This is the credibility moat for go-to-market: every other vendor
# publishes glossy threat reports. We publish the actual recall +
# FPR + per-vendor breakdown, every week, on the same script anyone
# can clone and re-run.
#
# The committed JSON+MD output lives under docs/benchmarks/, with
# a 'latest.json' symlink that the landing page reads to render
# the live methodology section.

on:
  schedule:
    # Sundays 15:15 UTC (18:15 Moscow). Each fresh Cleanway check may spend one
    # call of the service-wide daily budgets for paid sources (IPQS 150, LLM
    # judge 300 — per UTC day, api/services/paid_budget.py), and the run's
    # ~400 checks can use a whole day's IPQS. They must land on Sunday (UTC),
    # never on Monday, when Russian users need them all day.
    #
    # GitHub starts scheduled runs late: this workflow's last five started
    # 0.5 to 6.3 h after their cron time (Aug–Sep 2026), so a 21:15 start
    # reached Monday in 4 of 5 weeks. 15:15 leaves 7 h 45 min before the
    # `window` job's cut-off (23:00 UTC Sunday); a start later than that is
    # skipped for the week rather than spend Monday's budget. The Cleanway
    # checks fill the first ~30 min of the run (all resolvers start together),
    # so a start just before the cut-off still ends them by ~23:30 UTC.
    # The cost, when on time: the run may use up what is left of Sunday's
    # IPQS budget by ~18:45 Moscow, and users' checks then go without IPQS
    # until the 03:00 Moscow reset — a Sunday evening instead of a Monday.
    - cron: '15 15 * * 0'
  workflow_dispatch:
    inputs:
      sample:
        description: 'URLs per side (phishing + legit). Resolvers run side by side; VirusTotal (16 s a lookup) is the slowest: sample=100 → ~55 min, sample=200 → ~110 min. Above 200 VirusTotal is skipped (free tier: 500 lookups a day, and the timeout).'
        type: number
        default: 100

permissions:
  contents: write       # commit benchmark results
  pull-requests: write  # raise a PR on recall regression

jobs:
  window:
    # A scheduled run that GitHub starts too late would spend Monday's
    # paid-source budgets (see the cron comment). A dispatched run always goes:
    # whoever starts it by hand has chosen the time.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          weekday=$(date -u +%u)   # 7 = Sunday
          hour=$(date -u +%H)
          if [ "$EVENT" != "schedule" ] || { [ "$weekday" = 7 ] && [ "$hour" -lt 23 ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Scheduled benchmark started $(date -u '+%a %H:%M') UTC, past the Sunday 23:00 UTC cut-off: its Cleanway checks would spend Monday's paid-source budgets. Skipped this week; dispatch it by hand if it matters."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    needs: window
    if: needs.window.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Sized for VirusTotal, the slowest resolver: 16 s a lookup, measured
    # 15.75 s a URL (run 35589801520, 2026-09-21), so 2 x 200 URLs ≈ 105 min.
    # The resolvers run side by side, so the run takes about as long as VT
    # (Cleanway's 400 checks at ~15 a minute take ~27 min meanwhile), plus
    # ~5 min of setup and the legit-sample check: ~110 min at sample=200.
    # A cancelled run writes nothing — no dated file, no latest.json, no
    # commit — so the ceiling keeps ~40 min of headroom. (90 min, the old
    # value, cancelled every VT run above sample≈130: the resolvers used to
    # run one after another.)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          # We need full history to compare against the previous
          # week's recall for regression detection.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          pip install --upgrade pip
          # pydantic: the script imports the server's own allowlist rule
          # (api.services.scoring.is_trusted_top_domain) to prove the legit
          # sample sits outside it. Without it the report says
          # legit_outside_allowlist=false and the site shows no FP rate.
          pip install httpx==0.28.1 "pydantic>=2,<3"

      - name: Check the legitimate sample
        # Every listed site still resolves and none is auto-trusted. A red
        # step here is a to-do (prune the list), not a reason to skip the
        # week: a lapsed site scores `not_found`, which counts as no answer,
        # and an auto-trusted one is dropped by the run itself.
        continue-on-error: true
        run: python scripts/eval_fresh_urls.py --verify-legit-sample

      - name: Run benchmark
        env:
          # Public endpoints don't need keys but secrets are honoured.
          GOOGLE_SAFE_BROWSING_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_KEY }}
          PHISHTANK_API_KEY: ${{ secrets.PHISHTANK_API_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          # Optional. When set, eval_fresh_urls.py sends it as
          # X-Cleanway-Benchmark and the server skips its per-IP limits.
          # Without it the script identifies as a few rotating app installs
          # (X-Cleanway-Install) and stays under the server's per-IP
          # ceilings — see "Rate-limit identity" in the script.
          BENCHMARK_BYPASS_TOKEN: ${{ secrets.BENCHMARK_BYPASS_TOKEN }}
        run: |
          # We deliberately use the live PUBLIC endpoint here, not
          # --local-analyzer. The point is to measure what a real
          # user would see when they share a `cleanway.ai/check/<X>`
          # link. Public-only run keeps the benchmark anonymous,
          # exactly like a curious developer would.
          #
          # Sample sizing: dispatch honours the input; the schedule runs 200
          # per side (the gate needs >= 100 phishing). Without the token that
          # is ~400 Cleanway checks at ~15 a minute (~27 min); VirusTotal, run
          # alongside, sets the wall time: ~105 min for 400 lookups (see
          # timeout-minutes). Above 200 per side VT is skipped: 2 x sample
          # lookups would pass both its 500-a-day free quota and the timeout.
          if [ -n "${{ github.event.inputs.sample }}" ]; then
            SAMPLE="${{ github.event.inputs.sample }}"
          else
            SAMPLE=200
          fi
          VT_FLAG=""
          if [ "$SAMPLE" -gt 200 ]; then
            VT_FLAG="--no-virustotal"
            echo "::notice::sample=$SAMPLE > 200: VirusTotal skipped (500 lookups a day, 16 s each)."
          fi
          echo "Running benchmark with sample=$SAMPLE (bypass token $([ -n "${BENCHMARK_BYPASS_TOKEN}" ] && echo present || echo absent))"
          python scripts/eval_fresh_urls.py \
            --sample "$SAMPLE" \
            $VT_FLAG \
            --out-tag "$(date -u +%Y-%m-%d)"

      - name: Show latest pointer state
        run: |
          # The Python script owns the latest.json update now, guarded by
          # its --enforce-quality-gate flag (default on). If the run was
          # junk (rate-limit blowout, empty samples, null recall) the
          # pointer is deliberately left untouched. Print state so cron
          # log makes it obvious which run is currently public.
          cd docs/benchmarks
          ls -la
          if [ -L latest.json ] || [ -f latest.json ]; then
            echo "latest.json -> $(readlink latest.json 2>/dev/null || echo '(file)')"
          else
            echo "WARNING: docs/benchmarks/latest.json missing"
          fi

      - name: Detect recall regression
        id: regression
        run: |
          python3 <<'PY'
          import json, glob, os, sys
          files = sorted(glob.glob('docs/benchmarks/2*.json'))
          if len(files) < 2:
              print("regression=false", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              sys.exit(0)
          with open(files[-1]) as f:
              today = json.load(f)
          with open(files[-2]) as f:
              prior = json.load(f)
          today_recall = today['phishing'].get('cleanway', {}).get('recall')
          prior_recall = prior['phishing'].get('cleanway', {}).get('recall')
          regressed = False
          if today_recall is not None and prior_recall is not None:
              drop = prior_recall - today_recall
              if drop > 0.05:  # >5pp drop is regression
                  regressed = True
                  print(f"::warning::Recall dropped from {prior_recall:.1%} to {today_recall:.1%}")
          print(f"regression={'true' if regressed else 'false'}", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
          PY

      - name: Commit results
        run: |
          git config user.name 'cleanway-bot'
          git config user.email 'bot@cleanway.ai'
          git add docs/benchmarks/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: weekly fresh-URL benchmark $(date -u +%Y-%m-%d)

          Auto-generated by .github/workflows/weekly-benchmark.yml.
          Reproduce: python3 scripts/eval_fresh_urls.py --sample 100
          "
          git push

      - name: Open regression PR
        if: steps.regression.outputs.regression == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: cleanway/recall-regression-alert
          delete-branch: true
          title: '🚨 Weekly benchmark: recall regression detected'
          body: |
            The weekly fresh-URL benchmark shows the Cleanway public
            endpoint dropped >5pp in recall against fresh URLhaus +
            PhishTank URLs.

            **Possible causes:**
            - One of the 16 threat-intel sources is failing (check
              circuit breaker status at api.cleanway.ai/health)
            - A paid API key expired or hit quota
            - Cloudflare / upstream proxies started flagging us
            - URLhaus changed their feed format

            **Action:** investigate before publishing this week's
            methodology page snapshot.

            Recent benchmark files:
            - docs/benchmarks/latest.json
            - docs/benchmarks/$(date -u +%Y-%m-%d)-fresh-urls.json
          add-paths: docs/benchmarks/
