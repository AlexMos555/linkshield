name: E2E — Extension (real Chromium)

# Loads the unpacked Chrome and Safari builds into headless Chromium and
# drives the background service worker: threat counter, Family Hub
# fan-out + poller, the 30-day history prune, the exact-host trust list,
# and the localized content-script warnings. See the header of
# scripts/test-extension-sw.mjs for why this exists (the background's
# import() calls threw in every browser and nothing noticed).
#
# No production traffic: the test serves a local mock API and maps
# *.cleanway.ai to nowhere inside Chromium.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/extension-core/**"
      - "extension/**"
      - "extension-firefox/**"
      - "extension-safari/**"
      - "packages/i18n-strings/**"
      - "scripts/build-extensions.sh"
      - "scripts/build-i18n.py"
      - "scripts/test-extension-*.mjs"
      - ".github/workflows/e2e-extension.yml"
  push:
    branches: [main]
    paths:
      - "packages/extension-core/**"
      - "extension/**"
      - "extension-safari/**"
      - "packages/i18n-strings/**"

# Least privilege: the token is read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Throwaway install outside the repo: the test only needs playwright +
      # tweetnacl, and a full workspace install drags in Next.js and Expo.
      - name: Install test dependencies
        run: npm install --prefix "$RUNNER_TEMP/extension-e2e" --no-audit --no-fund playwright@1.62.1 tweetnacl@1.0.3

      # Chromium the way e2e-landing.yml installs its browsers (see the comment
      # there): OS packages and browser in separate steps with step timeouts
      # and up to 3 attempts of at most 3 minutes, because a slow apt mirror
      # used to hold `install --with-deps` until the job timeout. The cache key
      # is the playwright version installed above + Ubuntu release + arch +
      # browser, and `playwright install` runs on every job, so a stale cache
      # can't leave the browser missing.
      #
      # The .debs of the OS packages are cached the same way as there, for
      # the same reason (2026-10-27, run 40515847404: the mirror sent ~40 kB/s
      # and every 3-minute attempt timed out). Read the comment in
      # e2e-landing.yml before changing these steps: cached files reach apt
      # only after their name, size and checksum matched the signed indexes,
      # every cache step is continue-on-error, and only the .debs of packages
      # this job installed are saved.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(node -p 'require(process.env.RUNNER_TEMP + "/extension-e2e/node_modules/playwright/package.json").version')
          os=$(. /etc/os-release && echo "$ID-$VERSION_ID")
          echo "playwright $version on $os"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "os=$os" >> "$GITHUB_OUTPUT"
          # The apt cache key (see e2e-landing.yml). GitHub's runner images set
          # ImageOS and ImageVersion.
          # shellcheck disable=SC2016 # $(ARCHITECTURE) is apt's placeholder
          archs=$(apt-get indextargets --format '$(ARCHITECTURE)' 'Created-By: Packages' | LC_ALL=C sort -u | paste -sd+ -)
          prefix="playwright-apt-$RUNNER_OS-$os-$RUNNER_ARCH-${archs:-unknown}-chromium-"
          key="$prefix$version-${ImageOS:-unknown}-${ImageVersion:-unknown}"
          echo "apt cache key: $key"
          echo "apt-prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "apt-key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # A stuck restore must not hold the job: it gives up and the browser
        # is downloaded instead.
        timeout-minutes: 4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Restore cached apt packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # As for the browser: a stuck restore gives up, and apt downloads.
        timeout-minutes: 4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright.outputs.apt-key }}
          restore-keys: |
            ${{ steps.playwright.outputs.apt-prefix }}${{ steps.playwright.outputs.version }}-
            ${{ steps.playwright.outputs.apt-prefix }}

      - name: Load cached apt packages
        timeout-minutes: 4
        continue-on-error: true
        run: |
          stage=~/.cache/playwright-apt
          # dpkg's state before the install, for "Collect apt packages".
          dpkg-query -W -f '${db:Status-Abbrev} ${Package} ${Version}\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/playwright-apt-dpkg-before.txt"
          shopt -s nullglob
          cached=("$stage"/*.deb)
          if [ ${#cached[@]} -eq 0 ]; then
            echo "No cached apt packages"
            exit 0
          fi
          echo "Restored ${#cached[@]} cached .debs, $(du -sm "$stage" | cut -f1) MB"
          # Fresh indexes, so the check sees the versions apt is about to
          # install; if that fails, the runner's indexes are signed too.
          sudo timeout 2m apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update \
            || echo "::warning::apt-get update failed; checking the cached .debs against the runner's indexes"
          # 'URI' file-name size checksum per package, from an empty directory
          # (`apt-get download` leaves out files already in the current one).
          names=$(printf '%s\n' "${cached[@]##*/}" | grep -E '^[a-z0-9][a-z0-9+.-]*_' | cut -d_ -f1 | sort -u)
          # shellcheck disable=SC2086 # one argument per package name
          (cd "$(mktemp -d)" && apt-get download --print-uris $names) > "$RUNNER_TEMP/playwright-apt-uris.txt" || true
          mkdir -p "$stage/verified"
          while read -r _ file size hash; do
            case "$file" in ''|*/*) continue ;; esac
            f="$stage/$file"
            if [ -f "$f" ] && [ "$(stat -c %s "$f")" = "$size" ]; then
              case "$hash" in
                SHA512:*) sum=$(sha512sum < "$f") ;;
                SHA256:*) sum=$(sha256sum < "$f") ;;
                *) continue ;;
              esac
              if [ "${sum%% *}" = "${hash#*:}" ]; then mv "$f" "$stage/verified/"; fi
            fi
          done < "$RUNNER_TEMP/playwright-apt-uris.txt"
          verified=("$stage"/verified/*.deb)
          if [ ${#verified[@]} -gt 0 ]; then
            sudo cp -- "${verified[@]}" /var/cache/apt/archives/
          fi
          echo "Handed apt ${#verified[@]} of ${#cached[@]} cached .debs ($(du -sm "$stage/verified" | cut -f1) MB);" \
            "the rest are stale or don't match the index and are downloaded if needed"
          rm -rf "$stage"

      - name: Install Chromium OS dependencies
        timeout-minutes: 12
        run: |
          # Playwright builds the apt-get command line itself, so the short
          # network timeouts and retries go in an apt.conf.d drop-in, along
          # with keeping the downloaded .debs for the apt cache (apt-get's
          # default, made explicit).
          sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          DPkg::Lock::Timeout "60";
          APT::Keep-Downloaded-Packages "true";
          EOF
          # sudo outside `timeout`: as root, Playwright runs apt-get without
          # its own sudo, so `timeout` (root too) can kill apt-get. It does not
          # reach dpkg: apt-get starts dpkg in a session of its own, so an
          # attempt killed during the install phase leaves dpkg unpacking for
          # a few more seconds, holding the dpkg lock.
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if sudo -H env "PATH=$PATH" DEBIAN_FRONTEND=noninteractive \
                timeout --kill-after=15s 3m "$RUNNER_TEMP/extension-e2e/node_modules/.bin/playwright" install-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium OS dependencies: attempt $attempt failed or ran past 3 minutes"
            # Wait for a dpkg left over from the killed attempt, then let dpkg
            # finish what that attempt was in the middle of. While the old dpkg
            # still holds the lock, `--configure -a` fails, and the next
            # attempt stops at once on "dpkg was interrupted".
            for _ in $(seq 60); do pgrep -x dpkg > /dev/null || break; sleep 1; done
            sudo env DEBIAN_FRONTEND=noninteractive dpkg --configure -a \
              || echo "::warning::dpkg --configure -a failed; the next attempt may stop on an interrupted dpkg"
            sleep 10
          done
          echo "::error::Chromium OS dependencies did not install in 3 attempts (slow or unreachable apt mirror)"
          exit 1

      # Only the .debs of the packages this job installed or upgraded, so
      # stale versions and packages the image already has are not saved.
      - name: Collect apt packages for the cache
        id: apt-collect
        if: steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          stage=~/.cache/playwright-apt
          before="$RUNNER_TEMP/playwright-apt-dpkg-before.txt"
          rm -rf "$stage"
          mkdir -p "$stage"
          if [ ! -s "$before" ]; then
            echo "::warning::No dpkg state from before the install; not caching the apt packages"
            exit 0
          fi
          shopt -s nullglob
          debs=()
          while read -r status pkg version; do
            if [ "$status" != ii ]; then continue; fi
            # apt's file name: name_version_arch.deb, the epoch's ":" as %3a.
            debs+=(/var/cache/apt/archives/"${pkg}_${version//:/%3a}"_*.deb)
          done < <(dpkg-query -W -f '${db:Status-Abbrev} ${Package} ${Version}\n' \
                     | LC_ALL=C sort | LC_ALL=C comm -13 "$before" -)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::warning::No .debs of newly installed packages in /var/cache/apt/archives; nothing to cache"
            exit 0
          fi
          cp -- "${debs[@]}" "$stage/"
          echo "Caching ${#debs[@]} .debs, $(du -sm "$stage" | cut -f1) MB"
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save apt packages to the cache
        if: steps.apt-collect.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 4
        continue-on-error: true
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright.outputs.apt-key }}

      - name: Install Chromium
        timeout-minutes: 12
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          # Anything but an exact cache hit starts from an empty directory.
          # actions/cache reports a failed restore (download error, broken or
          # half-extracted tar) only as a warning and the step still succeeds,
          # and a restore cut off by the step timeout stops midway. Either can
          # leave a partial tree in which a browser's INSTALLATION_COMPLETE
          # marker came out of the tar before its files, so `playwright
          # install` would skip that browser.
          if [ "$CACHE_HIT" != "true" ]; then rm -rf ~/.cache/ms-playwright; fi
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if timeout --kill-after=15s 3m "$RUNNER_TEMP/extension-e2e/node_modules/.bin/playwright" install chromium; then
              exit 0
            fi
            echo "::warning::Chromium: attempt $attempt failed or ran past 3 minutes"
            sleep 10
          done
          echo "::error::Chromium did not download in 3 attempts"
          exit 1

      - name: Static extension checks
        run: node scripts/test-extension-core.mjs

      - name: Service worker + content scripts in Chromium
        # createRequire() in the test honours NODE_PATH.
        run: NODE_PATH="$RUNNER_TEMP/extension-e2e/node_modules" node scripts/test-extension-sw.mjs
