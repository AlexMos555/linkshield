name: E2E — Extension (real Chromium)

# Loads the unpacked Chrome and Safari builds into headless Chromium and
# drives the background service worker: threat counter, Family Hub
# fan-out + poller, the 30-day history prune, the exact-host trust list,
# and the localized content-script warnings. See the header of
# scripts/test-extension-sw.mjs for why this exists (the background's
# import() calls threw in every browser and nothing noticed).
#
# No production traffic: the test serves a local mock API and maps
# *.cleanway.ai to nowhere inside Chromium.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/extension-core/**"
      - "extension/**"
      - "extension-firefox/**"
      - "extension-safari/**"
      - "packages/i18n-strings/**"
      - "scripts/build-extensions.sh"
      - "scripts/build-i18n.py"
      - "scripts/test-extension-*.mjs"
      - ".github/workflows/e2e-extension.yml"
  push:
    branches: [main]
    paths:
      - "packages/extension-core/**"
      - "extension/**"
      - "extension-safari/**"
      - "packages/i18n-strings/**"

# Least privilege: the token is read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Throwaway install outside the repo: the test only needs playwright +
      # tweetnacl, and a full workspace install drags in Next.js and Expo.
      - name: Install test dependencies
        run: npm install --prefix "$RUNNER_TEMP/extension-e2e" --no-audit --no-fund playwright@1.62.1 tweetnacl@1.0.3

      # Chromium the way e2e-landing.yml installs its browsers (see the comment
      # there): OS packages and browser in separate steps with step timeouts
      # and up to 3 attempts of at most 3 minutes, because a slow apt mirror
      # used to hold `install --with-deps` until the job timeout. The cache key
      # is the playwright version installed above + Ubuntu release + arch +
      # browser, and `playwright install` runs on every job, so a stale cache
      # can't leave the browser missing.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(node -p 'require(process.env.RUNNER_TEMP + "/extension-e2e/node_modules/playwright/package.json").version')
          os=$(. /etc/os-release && echo "$ID-$VERSION_ID")
          echo "playwright $version on $os"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "os=$os" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        # A stuck restore must not hold the job: it gives up and the browser
        # is downloaded instead.
        timeout-minutes: 4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium OS dependencies
        timeout-minutes: 12
        run: |
          # Playwright builds the apt-get command line itself, so the short
          # network timeouts and retries go in an apt.conf.d drop-in.
          sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          DPkg::Lock::Timeout "60";
          EOF
          # sudo outside `timeout`: as root, Playwright runs apt-get without
          # its own sudo, so an expired attempt kills apt itself.
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if sudo -H env "PATH=$PATH" DEBIAN_FRONTEND=noninteractive \
                timeout --kill-after=15s 3m "$RUNNER_TEMP/extension-e2e/node_modules/.bin/playwright" install-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium OS dependencies: attempt $attempt failed or ran past 3 minutes"
            # Let dpkg finish anything an attempt was killed in the middle of.
            sudo env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true
            sleep 10
          done
          echo "::error::Chromium OS dependencies did not install in 3 attempts (slow or unreachable apt mirror)"
          exit 1

      - name: Install Chromium
        timeout-minutes: 12
        env:
          CACHE_OUTCOME: ${{ steps.playwright-cache.outcome }}
        run: |
          # A restore cut off by its step timeout can leave a partial tree.
          if [ "$CACHE_OUTCOME" != "success" ]; then rm -rf ~/.cache/ms-playwright; fi
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if timeout --kill-after=15s 3m "$RUNNER_TEMP/extension-e2e/node_modules/.bin/playwright" install chromium; then
              exit 0
            fi
            echo "::warning::Chromium: attempt $attempt failed or ran past 3 minutes"
            sleep 10
          done
          echo "::error::Chromium did not download in 3 attempts"
          exit 1

      - name: Static extension checks
        run: node scripts/test-extension-core.mjs

      - name: Service worker + content scripts in Chromium
        # createRequire() in the test honours NODE_PATH.
        run: NODE_PATH="$RUNNER_TEMP/extension-e2e/node_modules" node scripts/test-extension-sw.mjs
