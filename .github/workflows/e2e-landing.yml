name: E2E — Landing (Playwright)

on:
  workflow_dispatch:  # allow manual re-runs after backend-only fixes
  pull_request:
    paths:
      - "landing/**"
      - "packages/i18n-strings/**"
      - "scripts/build-i18n.py"
      - ".github/workflows/e2e-landing.yml"
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "packages/i18n-strings/**"

# Least privilege: the token is read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  e2e:
    name: e2e (billing ${{ matrix.billing }}, stripe ${{ matrix.stripe }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The operator-billed subscription pages exist only behind this flag
        # (landing/lib/billing-config.ts). Both states are built and tested:
        # "off" is today's site, "on" is what the founder's flip would ship —
        # landing/e2e/billing.spec.ts asserts each state and skips the other.
        billing: [off, on]
        # Stripe's world plans have their own switch, NEXT_PUBLIC_STRIPE_LIVE
        # (landing/lib/billing-config.ts): off, the world /pricing is the free
        # page; on, it sells the device plan. It does not depend on the flag
        # above (the world gets Stripe, Russia the operator subscription), so
        # all four combinations are builds Vercel could ship; the Stripe specs
        # skip when it is off (landing/e2e/billing-flag.ts). Wait for a green
        # "stripe on" run before setting the flag in Vercel (#276).
        stripe: [off, on]
    env:
      NEXT_PUBLIC_BILLING_ENABLED: ${{ matrix.billing == 'on' && '1' || '' }}
      NEXT_PUBLIC_STRIPE_LIVE: ${{ matrix.stripe == 'on' && '1' || '' }}
      # A fake Supabase project, so the pages that need sign-in render their
      # signed-in states. Nothing calls it: landing/e2e/extension-connect.spec.ts
      # answers every request to it with page.route. (*.supabase.co is in the
      # CSP's connect-src, so the build's CSP stays the production one.)
      NEXT_PUBLIC_SUPABASE_URL: https://cleanway-e2e.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-public-anon-key
    defaults:
      run:
        working-directory: landing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm

      # Monorepo uses npm workspaces — install from root.
      # The lockfile was generated on macOS and even `npm install` won't
      # re-fetch the linux variants of platform-native deps (@tailwindcss/oxide,
      # @parcel/watcher, lightningcss) when their lockfile entries pin
      # platform-specific tarballs that don't match the runner OS. We delete
      # the lockfile so npm re-resolves from package.json on Linux from scratch,
      # then `npm install` picks the correct native bindings for x64-linux-gnu.
      # Reproducibility cost is small here — this job only builds + runs Playwright,
      # not a release artifact.
      - name: Install dependencies
        working-directory: .
        # --legacy-peer-deps: mobile/ workspace has react-native-get-random-values@2
        # which declares peer react-native>=0.81 but we're pinned to 0.76.9 by
        # Expo SDK 52 (deferred until SDK 53/54 migration). Conflict is unrelated
        # to landing build and was previously masked by `npm ci`.
        run: |
          rm -f package-lock.json
          npm install --include=optional --legacy-peer-deps --no-audit --no-fund

      - name: Build landing
        run: npm run build

      # Playwright: the OS packages (apt) and the browsers are separate steps,
      # each with a step timeout and up to 3 attempts of at most 3 minutes.
      # A healthy runner needs ~20 s for apt and ~10 s for the browsers, but
      # azure.archive.ubuntu.com sometimes trickles the 142 MB of packages at
      # ~40 kB/s, and `playwright install --with-deps` sat in apt until the
      # 20-minute job timeout cancelled the job (#276, #291, #297). Now a slow
      # attempt is killed and retried on a new connection (apt keeps the
      # finished .debs and resumes partial ones), and a mirror that stays slow
      # fails the step in ~10 minutes with an explicit error.
      #
      # The browsers are cached. An earlier cache was keyed on
      # landing/package-lock.json, which doesn't exist (the workspace lockfile
      # is at the root, and it is deleted and regenerated above): the empty
      # hash hit STALE entries, the install was skipped, and tests failed with
      # "Executable doesn't exist". Now the key is the exact @playwright/test
      # version installed above + Ubuntu release + arch + browser list, and
      # `playwright install` runs on every job anyway: a no-op when the cached
      # browsers are complete (Playwright writes their INSTALLATION_COMPLETE
      # marker last), a download for anything missing.
      #
      # The OS packages are cached too. On 2026-10-27 the runners were on
      # ubuntu-26.04 (image 20261012.163), where install-deps fetches 185 new
      # and 6 upgraded packages, 142 MB: 22-38 s at 13:39 UTC, but at ~13:54
      # azure.archive.ubuntu.com sent ~40 kB/s and all three attempts timed
      # out in 3 of the 4 jobs (run 40515847404). Retries can't beat a mirror
      # that stays slow, so the .debs live in the Actions cache and a warm job
      # fetches only the indexes plus whatever changed since the cache was
      # written (PR #352: "Need to get 0 B/142 MB", install 15-30 s). The
      # cache is ~135 MB (191 .debs) here and ~24 MB (13) in e2e-extension.
      # - Key: playwright-apt-<OS>-<Ubuntu release>-<arch>-<browsers>_
      #   <Playwright version>-<variant>-<full|part>-<run>-<content hash>.
      #   Keys can't be overwritten, so the run id makes every save a new
      #   entry, and the newest is always the last one saved; the content
      #   hash keeps matrix legs that saw different images apart (legs with
      #   the same .debs share one entry).
      #   The browser list ends in "_", so e2e-extension's "chromium_" is not
      #   a prefix of "chromium+webkit_" and neither restores the other's
      #   cache. The variant is the architecture of the Ubuntu archive's
      #   indexes: ubuntu-26.04 reads amd64v3 builds (picked by CPU) that are
      #   stored under the same file names as the amd64 ones. Other apt
      #   sources don't count: packages.microsoft.com adds amd64, arm64 and
      #   armhf indexes that Playwright installs nothing from, and a change
      #   there must not make every restore miss.
      # - Restore takes the newest cache of this Playwright version and
      #   variant, else of any variant, else of any Playwright version.
      #   Nothing about the runner image is in the key: a new image restores
      #   the cache that is there and fetches only what that one lacks.
      # - apt takes a file in its archive directory on its size alone (the
      #   pkgAcqArchive constructor in apt-pkg/acquire-item.cc), so the cache
      #   is not restored there. "Load cached apt packages" runs apt-get
      #   update, then `apt-get download --print-uris` for the cached package
      #   names: file name, size and checksum of the version apt would
      #   install now, from the signed indexes. Only files that match all
      #   three are copied to /var/cache/apt/archives; stale versions, files
      #   cut short by a broken restore and anything corrupted or foreign are
      #   dropped and downloaded as before.
      # - Saved only when the job had to fetch 2 MB or more from the mirror
      #   (~50 s at the ~40 kB/s seen on 2026-10-27), whether the install
      #   passed or failed. A cache that left less to fetch is not stored
      #   again; one that left more is replaced by a newer one, which the
      #   next restore picks. What is saved: the .debs this job brought into
      #   apt's archive directory, handed over from the cache or downloaded
      #   (apt moves a download there only after its checksum matched).
      #   After a passing install, only those of packages now installed at
      #   that version. After a failed one, all of them, as a "part" cache:
      #   on 2026-10-27 a cold job had 31 of the 142 MB after two of its
      #   three timed-out attempts (job 122260047198), and nothing was kept,
      #   so a rerun on the still-slow mirror started from zero again.
      #   apt's partial/ downloads, its lock and its _apt sandbox never reach
      #   the cache.
      # - Scope: caches written by runs on main are restored by main and by
      #   PRs. A PR run's caches (a fork's PR included) belong to
      #   refs/pull/N/merge: only later runs of that same PR (new pushes and
      #   re-runs) restore them, never main or another PR. With the checksum
      #   check a cache can only spare a download, never change what gets
      #   installed. It holds public .debs only, no secrets.
      # - Every cache step has a timeout and continue-on-error. The worst
      #   case is the old full download, plus up to 11 minutes of these
      #   steps' timeouts if the cache service hangs. The retry loop is
      #   unchanged.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          os=$(. /etc/os-release && echo "$ID-$VERSION_ID")
          echo "@playwright/test $version on $os"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "os=$os" >> "$GITHUB_OUTPUT"
          # The apt cache key (see above). The variant comes from the Ubuntu
          # archive's Packages indexes only ("Origin: Ubuntu" in their Release
          # file); with no lists on the runner it is "unknown", which only
          # skips the first restore-key.
          # shellcheck disable=SC2016 # $(ARCHITECTURE) is apt's placeholder
          variant=$(apt-get indextargets --format '$(ARCHITECTURE)' 'Created-By: Packages' 'Origin: Ubuntu' \
            | LC_ALL=C sort -u | paste -sd+ -)
          base="playwright-apt-$RUNNER_OS-$os-$RUNNER_ARCH-chromium+webkit_"
          prefix="$base$version-${variant:-unknown}-"
          echo "apt cache prefix: $prefix"
          echo "apt-base=$base" >> "$GITHUB_OUTPUT"
          echo "apt-prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # A stuck restore must not hold the job: it gives up and the browsers
        # are downloaded instead.
        timeout-minutes: 4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Restore cached apt packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # As for the browsers: a stuck restore gives up, and apt downloads.
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: ~/.cache/playwright-apt
          # Saved keys end in a run id and a hash, so none is equal to this
          # one: the newest entry under the first prefix that has any wins.
          key: ${{ steps.playwright.outputs.apt-prefix }}
          restore-keys: |
            ${{ steps.playwright.outputs.apt-prefix }}
            ${{ steps.playwright.outputs.apt-base }}${{ steps.playwright.outputs.version }}-
            ${{ steps.playwright.outputs.apt-base }}

      - name: Load cached apt packages
        timeout-minutes: 3
        continue-on-error: true
        run: |
          stage=~/.cache/playwright-apt
          archives=/var/cache/apt/archives
          handed="$RUNNER_TEMP/playwright-apt-handed.txt"
          # For "Collect apt packages": the .debs apt's archive directory held
          # before this job, and (below) the ones this step hands to apt.
          find "$archives" -maxdepth 1 -name '*.deb' -printf '%f\n' > "$RUNNER_TEMP/playwright-apt-preexisting.txt"
          : > "$handed"
          shopt -s nullglob
          cached=("$stage"/*.deb)
          if [ ${#cached[@]} -eq 0 ]; then
            echo "No cached apt packages"
            exit 0
          fi
          echo "Restored ${#cached[@]} cached .debs, $(du -sm "$stage" | cut -f1) MB"
          # Fresh indexes, so the check sees the versions apt is about to
          # install (Playwright's own apt-get update right after is then a
          # quick "Hit"). If it fails, the indexes already on the runner are
          # signed too and still good for the check.
          sudo timeout 2m apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update \
            || echo "::warning::apt-get update failed; checking the cached .debs against the runner's indexes"
          # One line per package: 'URI' file-name size checksum. Run in an
          # empty directory: `apt-get download` leaves out files that are
          # already in the current one. A name apt doesn't know any more is
          # an error for that name only, hence the `|| true`.
          names=$(printf '%s\n' "${cached[@]##*/}" | grep -E '^[a-z0-9][a-z0-9+.-]*_' | cut -d_ -f1 | sort -u)
          # shellcheck disable=SC2086 # one argument per package name
          (cd "$(mktemp -d)" && apt-get download --print-uris $names) > "$RUNNER_TEMP/playwright-apt-uris.txt" || true
          mkdir -p "$stage/verified"
          while read -r _ file size hash; do
            case "$file" in ''|*/*) continue ;; esac
            f="$stage/$file"
            if [ -f "$f" ] && [ "$(stat -c %s "$f")" = "$size" ]; then
              case "$hash" in
                SHA512:*) sum=$(sha512sum < "$f") ;;
                SHA256:*) sum=$(sha256sum < "$f") ;;
                *) continue ;;
              esac
              if [ "${sum%% *}" = "${hash#*:}" ]; then mv "$f" "$stage/verified/"; fi
            fi
          done < "$RUNNER_TEMP/playwright-apt-uris.txt"
          verified=("$stage"/verified/*.deb)
          if [ ${#verified[@]} -gt 0 ]; then
            sudo cp -- "${verified[@]}" "$archives/"
            printf '%s\n' "${verified[@]##*/}" > "$handed"
          fi
          echo "Handed apt ${#verified[@]} of ${#cached[@]} cached .debs ($(du -sm "$stage/verified" | cut -f1) MB);" \
            "the rest are stale or don't match the index and are downloaded if needed"
          rm -rf "$stage"

      - name: Install Playwright OS dependencies
        id: apt-install
        timeout-minutes: 12
        run: |
          # Playwright builds the apt-get command line itself, so the short
          # network timeouts and retries go in an apt.conf.d drop-in, along
          # with keeping the downloaded .debs for the apt cache (apt-get's
          # default, made explicit).
          sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          DPkg::Lock::Timeout "60";
          APT::Keep-Downloaded-Packages "true";
          EOF
          # sudo outside `timeout`: as root, Playwright runs apt-get without
          # its own sudo, so `timeout` (root too) can kill apt-get. It does not
          # reach dpkg: apt-get starts dpkg in a session of its own, so an
          # attempt killed during the install phase leaves dpkg unpacking for
          # a few more seconds, holding the dpkg lock.
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if sudo -H env "PATH=$PATH" DEBIAN_FRONTEND=noninteractive \
                timeout --kill-after=15s 3m npx playwright install-deps chromium webkit; then
              exit 0
            fi
            echo "::warning::Playwright OS dependencies: attempt $attempt failed or ran past 3 minutes"
            # Wait for a dpkg left over from the killed attempt, then let dpkg
            # finish what that attempt was in the middle of. While the old dpkg
            # still holds the lock, `--configure -a` fails, and the next
            # attempt stops at once on "dpkg was interrupted".
            for _ in $(seq 60); do pgrep -x dpkg > /dev/null || break; sleep 1; done
            sudo env DEBIAN_FRONTEND=noninteractive dpkg --configure -a \
              || echo "::warning::dpkg --configure -a failed; the next attempt may stop on an interrupted dpkg"
            sleep 10
          done
          echo "::error::Playwright OS dependencies did not install in 3 attempts (slow or unreachable apt mirror)"
          exit 1

      # Also after a failed install (see above): what it fetched before it
      # failed is saved as a "part" cache.
      - name: Collect apt packages for the cache
        id: apt-collect
        if: ${{ !cancelled() && steps.apt-install.outcome != 'skipped' }}
        timeout-minutes: 2
        continue-on-error: true
        env:
          INSTALL_OUTCOME: ${{ steps.apt-install.outcome }}
          APT_PREFIX: ${{ steps.playwright.outputs.apt-prefix }}
        run: |
          stage=~/.cache/playwright-apt
          archives=/var/cache/apt/archives
          pre="$RUNNER_TEMP/playwright-apt-preexisting.txt"
          handed="$RUNNER_TEMP/playwright-apt-handed.txt"
          rm -rf "$stage"
          mkdir -p "$stage"
          if [ ! -f "$pre" ] || [ ! -f "$handed" ]; then
            echo "::warning::\"Load cached apt packages\" stopped early; not caching the apt packages"
            exit 0
          fi
          declare -A preexisting=() from_cache=() installed=()
          while read -r f; do if [ -n "$f" ]; then preexisting[$f]=1; fi; done < "$pre"
          while read -r f; do if [ -n "$f" ]; then from_cache[$f]=1; fi; done < "$handed"
          if [ "$INSTALL_OUTCOME" = success ]; then
            # apt's file name: name_version_arch.deb, the epoch's ":" as %3a.
            while read -r status pkg version; do
              if [ "$status" = ii ]; then installed[${pkg}_${version//:/%3a}]=1; fi
            done < <(dpkg-query -W -f '${db:Status-Abbrev} ${Package} ${Version}\n')
          fi
          shopt -s nullglob
          keep=()
          fetched=0
          fetched_bytes=0
          for f in "$archives"/*.deb; do
            name=${f##*/}
            if [ -n "${preexisting[$name]:-}" ] && [ -z "${from_cache[$name]:-}" ]; then continue; fi
            if [ "$INSTALL_OUTCOME" = success ] && [ -z "${installed[${name%_*}]:-}" ]; then continue; fi
            keep+=("$f")
            if [ -z "${from_cache[$name]:-}" ]; then
              fetched=$((fetched + 1))
              fetched_bytes=$((fetched_bytes + $(stat -c %s "$f")))
            fi
          done
          echo "Install $INSTALL_OUTCOME: $((${#keep[@]} - fetched)) .debs came from the cache," \
            "$fetched ($((fetched_bytes / 1024)) kB) from the mirror"
          if [ "$fetched_bytes" -lt $((2 * 1024 * 1024)) ]; then
            echo "Less than 2 MB came from the mirror: the cache is not saved again"
            exit 0
          fi
          cp -- "${keep[@]}" "$stage/"
          kind=part
          if [ "$INSTALL_OUTCOME" = success ]; then kind=full; fi
          hash=$(cd "$stage" && export LC_ALL=C && sha256sum -- *.deb | sha256sum | cut -c1-16)
          key="$APT_PREFIX$kind-$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT-$hash"
          echo "Caching ${#keep[@]} .debs, $(du -sm "$stage" | cut -f1) MB, as $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save apt packages to the cache
        if: ${{ !cancelled() && steps.apt-collect.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.apt-collect.outputs.key }}

      - name: Install Playwright browsers
        timeout-minutes: 12
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          # Anything but an exact cache hit starts from an empty directory.
          # actions/cache reports a failed restore (download error, broken or
          # half-extracted tar) only as a warning and the step still succeeds,
          # and a restore cut off by the step timeout stops midway. Either can
          # leave a partial tree in which a browser's INSTALLATION_COMPLETE
          # marker came out of the tar before its files, so `playwright
          # install` would skip that browser.
          if [ "$CACHE_HIT" != "true" ]; then rm -rf ~/.cache/ms-playwright; fi
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if timeout --kill-after=15s 3m npx playwright install chromium webkit; then
              exit 0
            fi
            echo "::warning::Playwright browsers: attempt $attempt failed or ran past 3 minutes"
            sleep 10
          done
          echo "::error::Playwright browsers did not download in 3 attempts"
          exit 1

      - name: Run Playwright tests
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-billing-${{ matrix.billing }}-stripe-${{ matrix.stripe }}
          path: landing/playwright-report/
          retention-days: 7

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-billing-${{ matrix.billing }}-stripe-${{ matrix.stripe }}
          path: landing/test-results/
          retention-days: 7
