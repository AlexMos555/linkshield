version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # One npm entry at the root: landing/, mobile/ and packages/ are workspaces
  # that share the root package-lock.json. Per-folder entries bumped a
  # workspace's package.json without the root lock, so every such PR failed
  # "Verify package-lock is in sync".
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Expo pins these to the SDK (mobile is on SDK 58): moving them one by
      # one breaks the native build. They move together, in an SDK upgrade.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # react must match the renderer bundled with react-native exactly, so
      # even a patch bump breaks the mobile app; it moves with the Expo SDK.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # Majors that need the Expo SDK / toolchain upgrade first.
      # Native module pinned by the Expo SDK (expo install); moves with it.
      - dependency-name: "@sentry/react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sentry/nextjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # A Next.js major is a migration (the landing was moved to 15 by hand).
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # react-email 4+ runs its preview through @react-email/ui at the exact
      # same version, and ui 6.x pins next 16 (root override keeps 15.5.28).
      # It moves in a deliberate migration with @react-email/components -> react-email.
      - dependency-name: "react-email"
        update-types: ["version-update:semver-major"]

  # Every action in .github/workflows is pinned to a full commit SHA with a
  # "# vX.Y.Z" comment; Dependabot bumps the SHA and the comment together.
  # One grouped PR a month instead of one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
