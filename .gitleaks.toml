# gitleaks config — block these secret patterns from ever being committed.
# Run: gitleaks detect / gitleaks protect
# CI: .github/workflows/security.yml uses the same config.

title = "Cleanway gitleaks config"

[extend]
# Inherit gitleaks default ruleset (covers AWS, GCP, GitHub, Stripe, etc.)
useDefault = true

# ── Project-specific patterns ──────────────────────────────────
[[rules]]
id = "supabase-access-token"
description = "Supabase Management API personal access token"
regex = '''sbp_[a-f0-9]{40}'''
tags = ["supabase", "secret"]

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key (sb_secret_*)"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
tags = ["supabase", "secret"]

[[rules]]
id = "supabase-jwt"
description = "Supabase JWT (anon/service_role)"
# Match supabase-issued JWTs containing the supabase iss claim
regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{40,}'''
tags = ["supabase", "jwt"]

[[rules]]
id = "stripe-secret-key"
description = "Stripe secret API key"
regex = '''sk_(test|live)_[A-Za-z0-9]{24,}'''
tags = ["stripe", "secret"]

[[rules]]
id = "stripe-restricted-key"
description = "Stripe restricted key"
regex = '''rk_(test|live)_[A-Za-z0-9]{24,}'''
tags = ["stripe", "secret"]

[[rules]]
id = "stripe-webhook-secret"
description = "Stripe webhook signing secret"
regex = '''whsec_[A-Za-z0-9]{32,}'''
tags = ["stripe", "secret"]

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''AIza[0-9A-Za-z_-]{35}'''
tags = ["google", "secret"]

[[rules]]
id = "openai-api-key"
description = "OpenAI / Anthropic / generic Bearer-style API key"
regex = '''(sk-proj-[A-Za-z0-9_-]{40,}|sk-ant-[A-Za-z0-9_-]{40,})'''
tags = ["llm", "secret"]

# ── Allowlist (legitimate placeholders / docs / false positives) ──
[allowlist]
description = "Files that contain placeholders, not real secrets"
paths = [
    '''^\.env\.example$''',
    '''^\.gitleaks\.toml$''',           # this file's own examples
    '''^api/services/pricing\.py$''',   # contains "price_PERSONAL_T1_MONTHLY" placeholders
    '''^tests/.*\.py$''',               # tests use dummy secrets like "test-secret-..."
    '''^\.planning/.*\.md$''',          # docs may reference secret formats
    # ── False positives from gitleaks generic-api-key heuristic ──
    # All three patterns below trip the same heuristic — long base64-ish
    # strings — but contain ZERO real secrets. Verified by inspection
    # of every flagged line. Match by basename so source + generated
    # copies in extension/, extension-firefox/, extension-safari/ are
    # all covered.
    '''family-crypto\.(js|ts)$''',      # TweetNaCl operations: keypair() outputs
                                         # in comments/logs look like API keys
    '''family-fanout\.js$''',           # public-key caching code; cached value
                                         # bytes mimic API-key shape
    '''top_100k\.json$''',              # Tranco top-100K bloom-filter seed —
                                         # a handful of legit domain names look
                                         # base64-shaped to the heuristic
    # The weekly benchmark's URL lists (scripts/eval_fresh_urls.py, committed
    # by the benchmark bot): phishing URLs copied from public feeds, whose
    # query strings carry kits' random tracking tokens ("token=…", "_token=…").
    # Each new week brought a new shape and turned the weekly full-history
    # scan red (2026-10-19: docs/benchmarks/2026-10-18-fresh-urls.json:14449).
    # Nothing of ours is ever written there. Exactly these generated files,
    # by name: any other file under docs/benchmarks/ is still scanned.
    '''^docs/benchmarks/[0-9]{4}-[0-9]{2}-[0-9]{2}-fresh-urls\.(json|md)$''',
]
# Ignore obvious placeholder strings. Matched against the extracted secret.
regexes = [
    # Tracking token of a phishing kit's link ("_token=<random>.<epoch>.<n>.<md5>")
    # in the weekly benchmark's public-feed URL lists. No credential of ours
    # has this shape. Exact historical findings are in .gitleaksignore.
    '''^[a-z0-9]{8,20}\.1[0-9]{9}\.[0-9]{1,2}\.[0-9a-f]{32}$''',
    # A dotted i18n key (landing.dns.benefit_2) read as the "secret" after a
    # translated sentence containing "credential"/"token"/"password".
    '''^(landing|mobile|extension|email|common)(\.[a-z0-9_]+)+$''',
    '''sbp_\.\.\.''',
    '''sb_secret_\.\.\.''',
    '''sk_test_\.\.\.''',
    '''sk_live_\.\.\.''',
    '''eyJ\.\.\.''',
    '''YOUR_[A-Z_]+''',
    '''placeholder''',
    '''<your-.*>''',
    '''<.*-here>''',
]
